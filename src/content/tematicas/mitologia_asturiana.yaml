# Temática: Mitología asturiana
# Cada panel necesita: frase, pista y nivel (facil | moderado | dificil).
# "ayuda" es opcional: es una segunda pista que se enseña al pulsar el botón Ayuda.
nombre: Mitología asturiana
icono: "🧚‍♀️"
paneles:
  # ---------- FÁCIL ----------
  - frase: Xana
    pista: Ninfa o hada de aguas cristalinas
    nivel: facil
    ayuda: Cuidan de la naturaleza
  - frase: Deva
    pista: Diosa del agua
    nivel: facil
    ayuda: Da nombre a una montaña, una isla y un río
  - frase: Bruxa
    pista: Tiene una escoba y un caldero
    nivel: facil
    ayuda: Hace magia
  - frase: Trasgu
    pista: Duende de personalidad traviesa y espíritu inquieto
    nivel: facil
    ayuda: Tiene un agujero en la mano izquierda
  
  # ---------- MODERADO ----------
  - frase: Nuberu
    pista: Dios asturiano de las tormentas, el granizo y la lluvia
    nivel: moderado
    ayuda: Cantante asturiano
  - frase: El Basiliscu
    pista: Ser mitológico con cuerpo de serpiente y cabeza de gallo
    nivel: moderado
    ayuda: Tener un enfado muy grande
  - frase: Cuélebre
    pista: Serpiente gigante que custodia tesoros
    nivel: moderado
    ayuda: Canción de Victor Manuel

  # ---------- DIFÍCIL ----------
  - frase: Diañu Burlón
    pista: Ser mitológico asturiano que representa al macho cabrío y al diablo
    nivel: dificil

