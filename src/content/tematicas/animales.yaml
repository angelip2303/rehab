# Temática: Mitología Asturiana
# Cada panel necesita: frase, pista y nivel (facil | moderado | dificil).
# "ayuda" es opcional: es una segunda pista que se enseña al pulsar el botón Ayuda.
nombre: Animales
icono: "🐾"
paneles:
  # ---------- FÁCIL ----------
  - frase: Ratón
    pista: Roedor al que le gusta el queso
    nivel: facil
    ayuda: Le persigue el gato
  - frase: Perro
    pista: El mejor amigo del ser humano
    nivel: facil
    ayuda: Hace guau
  - frase: Gato negro
    pista: Dicen que trae mala suerte si se cruza
    nivel: facil
  - frase: El burro de la granja
    pista: Animal de orejas largas que rebuzna
    nivel: facil
  - frase: La gallina pone huevos
    pista: Lo que hace cada día un ave del corral
    nivel: facil
    
  # ---------- MODERADO ----------
  - frase: Elefante africano
    pista: El animal terrestre más grande
    nivel: moderado
    ayuda: Tiene trompa
  - frase: Caballo de carreras
    pista: Corre en el hipódromo
    nivel: moderado
  - frase: La jirafa tiene el cuello largo
    pista: Así alcanza las hojas de los árboles
    nivel: moderado
  - frase: Los pingüinos viven en el Polo Sur
    pista: Ave que no vuela y camina con gracia
    nivel: moderado
  - frase: Las abejas fabrican miel en la colmena
    pista: Un trabajo dulce en equipo
    nivel: moderado
  - frase: El camaleón cambia de color
    pista: Un reptil que se camufla
    nivel: moderado

  # ---------- DIFÍCIL ----------
  - frase: Perro ladrador, poco mordedor
    pista: Refrán sobre quien amenaza mucho
    nivel: dificil
  - frase: A caballo regalado no le mires el diente
    pista: Refrán sobre los regalos
    nivel: dificil
  - frase: La tortuga y la liebre hicieron una carrera
    pista: Fábula sobre la constancia
    nivel: dificil
  - frase: Cada oveja con su pareja
    pista: Refrán sobre juntarse con quien se parece
    nivel: dificil
  - frase: Más vale pájaro en mano que ciento volando
    pista: Refrán sobre lo seguro
    nivel: dificil
  - frase: El búho caza ratones por la noche
    pista: Ave nocturna de grandes ojos
    nivel: dificil
